name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: |
          mkdir -p temp_lib
          cp Main.dart temp_lib/main.dart 2>/dev/null || cp main.dart temp_lib/main.dart 2>/dev/null || true
          rm -rf pubspec.yaml lib test ios android web linux macos windows
          flutter create . --project-name ethio_market_app
          cp temp_lib/main.dart lib/main.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethio_market_app
          path: build/app/outputs/flutter-apk/app-release.apk
