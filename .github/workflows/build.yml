name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Build Setup
        run: |
          mkdir -p temp_dir
          cp Main.dart temp_dir/main.dart 2>/dev/null || cp main.dart temp_dir/main.dart 2>/dev/null || true
          # Remove everything except workflow and Main.dart
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'Main.dart' ! -name 'main.dart' -exec rm -rf {} +
          flutter create . --org com.ethio.market --project-name ethio_market_app --platforms=android
          mkdir -p lib
          cp temp_dir/main.dart lib/main.dart 2>/dev/null || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethio_market_app
          path: build/app/outputs/flutter-apk/app-debug.apk
